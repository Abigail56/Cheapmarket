[project]
name = "cheapmarketdeal-api"
version = "0.1.0"
description = "Backend API for Cheapmarketdeal (affordable groceries & fresh produce)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0",  # pulls in greenlet, which async engines need
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "sentry-sdk[fastapi]>=2.0",
    "pywebpush>=2.0",
    "pillow>=11.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]  # generated by alembic

[tool.ruff.lint]
# B008 (Query() in defaults) and RUF012 are normal FastAPI/Pydantic patterns
ignore = ["B008", "RUF012", "UP046", "BLE001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
