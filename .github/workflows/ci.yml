name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---- API (Backend/) ----
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cmd_user
          POSTGRES_PASSWORD: cmd_password
          POSTGRES_DB: cmd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cmd_user -d cmd_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      POSTGRES_USER: cmd_user
      POSTGRES_PASSWORD: cmd_password
      POSTGRES_HOST: localhost
      SECRET_KEY: ci-only-secret-key-0123456789-abcdefghijklmnop

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: Backend/uv.lock

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked --python 3.12

      - name: Lint
        run: uv run ruff check .

      - name: Migrations apply cleanly and match the models
        env:
          POSTGRES_DB: cmd_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base

      - name: Tests
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Image builds
        run: docker build -t cheapmarketdeal-api:ci .
        working-directory: Backend

  # ---- Shop (Frontend/) ----
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx next typegen && npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
      - name: Image builds
        run: docker build --build-arg NEXT_PUBLIC_API_URL=https://api.example.com -t cheapmarketdeal-web:ci .
